name: Publish to npm

on:
  release:
    types: [published]

# OIDC trusted publishing — npm verifies this workflow's identity, so no
# NPM_TOKEN secret and no 2FA OTP are needed. Configure the trusted publisher
# for the `anymodel` package at npmjs.com (package Settings -> Trusted Publishing).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.0 (node 22 ships older).
      - run: npm install -g npm@latest
      - run: npm test
      - run: node scripts/brand-patch.mjs --check
      - run: npm publish --provenance --access public
