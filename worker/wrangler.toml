name = "anymodel-proxy"
main = "index.mjs"
compatibility_date = "2024-12-01"

workers_dev = true
routes = [
  { pattern = "api.anymodel.dev/*", zone_id = "cea2ba6aacd5a00a032eb83d86badcd8" }
]

[vars]
FREE_ONLY = "true"
RPM = "60"
ANYMODEL_MAX_BODY_BYTES = "4194304"

# Secrets (set via `wrangler secret put`):
# OPENROUTER_API_KEY (optional; disabled unless ANYMODEL_TOKEN is also set)
# ANYMODEL_TOKEN (required for server-funded requests; also gates BYOK when set)
